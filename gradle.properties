# 4g rather than 3g: on the 16GB GitHub runner, R8 and full lint are the memory
# hogs, and the headroom keeps the daemon out of GC pressure.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# CI runs one Gradle invocation per job, so this saves little there; it is kept
# because it makes local iteration faster and costs nothing when unused.
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

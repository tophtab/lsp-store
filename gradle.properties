org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# CI runs two Gradle invocations per job (gate, then the release build). The
# configuration cache makes the second one skip configuration entirely; it also
# survives between the lint/test and assemble steps of a single push.
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
